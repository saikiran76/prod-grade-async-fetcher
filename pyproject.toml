[build-system]
requires=["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prod-async-fetcher"
version = "0.1.0"
requires-python = ">=3.12"

dependencies= [
    'httpx',
    'pydantic',
    'beautifulsoup4',
    'typer',
    'rich'
]

[tool.hatch.build.targets.wheel]
packages = ["src/prod_async_fetcher"]